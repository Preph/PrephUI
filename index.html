  const row = (pg, parent, icon, html, kind) => {
    const r = E('div', 'prow', `<i class="fa-solid ${icon}"></i><span>${html}</span>`); parent.append(r);
    ix(pg, r, html, kind || 'Text'); return r;
  };

  /* ---- page definitions ---- */
  const defs = [{ id: 'home', title: 'Overview', noHeader: true, build: homeBuild }];
  p.categories.forEach(c => defs.push({ id: c.id, title: c.title, desc: c.tag, build: (root, pg) => categoryBuild(root, pg, c) }));

  const mk = (d, parent) => {
    const pg = { id: d.id, title: strip(d.title), desc: d.desc, noHeader: d.noHeader, icon: d.icon, build: d.build, parent, children: [], anchors: [], entries: [], path: [],
      root: E('div', 'page'), group: parent ? parent.group : (groupOf[d.id] || null) };
    pg.root.hidden = true;
    pg.crumb = (pg.group ? pg.group + ' > ' : '') + (parent ? parent.title + ' > ' : '') + pg.title;
    M.pages[pg.id] = pg; M.order.push(pg.id);
    if (parent) parent.children.push(pg);
    return pg;
  };
  defs.forEach(d => mk(d, null));

  M.order.forEach(id => {
    const pg = M.pages[id], root = pg.root;
    let hd = null;
    if (!pg.noHeader) {
      hd = E('div', 'ph'); const h = E('h1'); h.textContent = pg.title; hd.append(h); root.append(hd);
      if (pg.desc) { const d = E('p', 'para', pg.desc); root.append(d); }
    }
    const pe = { page: pg, el: root, kind: 'Page', label: pg.title, tip: strip(pg.desc || ''), section: '', crumb: pg.crumb };
    prep(pe); pg.entries.push(pe); M.entries.push(pe);
    pg.build(root, pg);
    if (hd && $('.col', root)) {
      const un = E('button', 'btn ghost', 'Uncollapse All'), co = E('button', 'btn ghost', 'Collapse All');
      un.onclick = () => $$('.col', root).forEach(c => setOpen(c, true));
      co.onclick = () => { $$('.col', root).forEach(c => setOpen(c, false)); ui.sc.scrollTop = 0; };
      hd.append(co, un);
    }
  });

  /* ---- page builders ---- */
  function homeBuild(root, pg) {
    const h = p.hero, a = p.about;
    const hero = E('div', 'hero');
    hero.innerHTML = (h.badges || []).map(b => `<span class="badge">${b}</span>`).join('') + `<h1 class="h1">${h.h1}</h1><p class="lead">${h.lead}</p>`;
    root.append(hero);
    ix(pg, $('.h1', hero), h.h1, 'Text', h.lead);
    (h.badges || []).forEach(b => ix(pg, null, b, 'Text'));
    preview(pg, root, h.shots.map(s => ({ src: img(s[1] || s[0]), cap: s[1] ? s[0] : '' })), p.tab, false);
    if (a) sec(pg, root, strip(a.title), b => {
      a.text.forEach(t => para(pg, b, t));
      a.points.forEach(x => row(pg, b, x[0], x[1]));
      if (a.shot) { const w = E('div'); w.style.marginTop = '10px'; b.append(w); preview(pg, w, [{ src: img(a.shot), cap: 'Edit Mode' }], 'Edit Mode', false); }
    });
    sec(pg, root, 'Explore', b => {
      const g = E('div', 'cards');
      p.categories.forEach(c => {
        const k = E('button', 'card', `<i class="fa-solid ${c.icon}"></i><div><b>${c.title}</b><span>${strip(c.tag || '')}</span></div>`);
        k.onclick = () => select(c.id); g.append(k);
      });
      b.append(g);
    });
    sec(pg, root, strip(p.cta.title), b => {
      b.append(E('p', 'para cta-p', p.cta.text));
      ix(pg, b.lastChild, p.cta.text, 'Text');
      const r = E('div', 'btnrow');
      p.cta.links.forEach((l, i) => r.append(E('a', 'btn' + (i ? '' : ' acc'), `<i class="${l[0]}"></i> ${l[1]}`)));
      $$('a', r).forEach((a, i) => { a.href = p.cta.links[i][2]; a.target = '_blank'; a.rel = 'noopener'; });
      b.append(r);
    });
  }

  function categoryBuild(root, pg, c) {
    if (c.intro) para(pg, root, c.intro);
    let pv = null;
    if (c.shots && c.shots.length) pv = preview(pg, root, c.shots.map(s => ({ src: img(s[0]), cap: s[1] || '' })), strip(c.title), false);
    (c.features || []).forEach(f =>
      col(pg, root, f[1], { open: true, tip: f[2], onOpen: () => { if (f[3] && pv) pv.showSrc(img(f[3])); } }, cb => cb.append(E('p', 'para', f[2]))));
    const anchor = (id, title, el) => pg.anchors.push({ id, title, el });
    (c.tables || []).forEach((t, i) => anchor('t' + i, t.title || 'Reference', tableBuild(root, pg, t, 't' + i)));
    if (c.perf && c.perf.length)
      anchor('perf', 'Performance', col(pg, root, 'Performance', { id: 'perf', open: false, kind: 'Section' }, b => {
        c.perf.forEach(x => row(pg, b, 'fa-check', x, 'Performance'));
      }));
    if ((c.shots || []).length > 1) anchor('shots', 'Screenshots', galleryBuild(root, pg, c));
  }

  function tableBuild(root, pg, t, id) {
    return col(pg, root, t.title || 'Reference', { id, open: false, kind: 'Section' }, b => {
      let inp = null;
      if (t.rows.length > 8) { inp = E('input', 'filter'); inp.placeholder = 'Filter...'; inp.setAttribute('aria-label', 'Filter'); b.append(inp); }
      const w = E('div', 'tw'), tb = E('table'), tr0 = E('tr');
      t.head.forEach(hh => tr0.append(E('th', null, hh)));
      const th = E('thead'); th.append(tr0); const body = E('tbody'); tb.append(th, body);
      const trs = t.rows.map(r => {
        const tr = E('tr'); r.forEach(cell => tr.append(E('td', null, cell))); body.append(tr);
        ix(pg, tr, r[0], 'Entry', r.slice(1).join(' ')); tr._t = strip(r.join(' ')).toLowerCase(); return tr;
      });
      if (inp) inp.oninput = () => { const q = inp.value.toLowerCase().trim(); trs.forEach(tr => tr.hidden = !!q && !tr._t.includes(q)); };
      w.append(tb); b.append(w);
    });
  }

  function galleryBuild(root, pg, c) {
    return col(pg, root, 'Screenshots', { id: 'shots', open: false, kind: 'Section' }, b => {
      const g = E('div', 'gal');
      c.shots.forEach(s => {
        const f = E('figure'), im = E('img'); im.src = img(s[0]); im.alt = s[1] || ''; im.loading = 'lazy'; im.dataset.lb = '1';
        im.onerror = () => f.classList.add('bad'); f.append(im);
        if (s[1]) { f.append(E('figcaption', null, s[1])); ix(pg, f, s[1], 'Screenshot'); }
        g.append(f);
      });
      b.append(g);
    });
  }
  return M;
}

/* =====================================================================
   Sidebar
   ===================================================================== */
function navModel(M) {
  const hits = state.query ? state.hits : null, list = [];
  const vis = pg => !hits || hits[pg.id] > 0;
  M.groups.forEach(g => {
    const roots = g.ids.map(id => M.pages[id]).filter(Boolean);
    if (!roots.some(vis)) return;
    list.push({ group: g.name });
    roots.forEach(pg => {
      if (!vis(pg)) return;
      const kids = pg.anchors.length > 0;
      list.push({ page: pg, depth: 0, kids, count: hits ? hits[pg.id] : null });
      if (kids && !hits && !state.collapsed[pg.id]) pg.anchors.forEach(a => list.push({ page: pg, anchor: a, depth: 1 }));
    });
  });
  return list;
}
function renderNav() {
  const keep = ui.nav.scrollTop, frag = document.createDocumentFragment();
  navModel(state.M).forEach(r => {
    if (r.group) { const g = E('div', 'ng'); g.textContent = r.group.toUpperCase(); frag.append(g); return; }
    const pg = r.page, here = state.current === pg.id && !state.query;
    const on = r.anchor ? here && state.anchor === r.anchor.id : here && !state.anchor;
    const b = E('div', 'nr' + (on ? ' on' : '')); b.dataset.id = pg.id; if (r.anchor) b.dataset.anchor = r.anchor.id; b.style.paddingLeft = (6 + r.depth * 14) + 'px';
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    const ch = E('span', 'nchev' + (r.kids && !r.anchor && !state.query ? '' : ' none'), `<span class="chev${state.collapsed[pg.id] ? '' : ' dn'}"></span>`);
    ch.dataset.tog = pg.id;
    const t = E('span', 'nt'); t.textContent = r.anchor ? r.anchor.title : pg.title;
    const c = E('span', 'nc'); c.textContent = r.count != null ? r.count : '';
    b.append(ch, t, c); frag.append(b);
  });
  ui.nav.replaceChildren(frag); ui.nav.scrollTop = keep;
}
ui.nav.addEventListener('click', e => {
  const tg = e.target.closest('[data-tog]');
  if (tg && !tg.classList.contains('none')) { state.collapsed[tg.dataset.tog] = !state.collapsed[tg.dataset.tog]; renderNav(); return; }
  const r = e.target.closest('.nr'); if (r) select(r.dataset.id, { anchor: r.dataset.anchor });
});
ui.nav.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const r = e.target.closest('.nr'); if (r) { e.preventDefault(); select(r.dataset.id, { anchor: r.dataset.anchor }); }
});
function renderSideBar() {
  const p = state.M.p, f = document.createDocumentFragment(), seen = new Set();
  const add = (icon, text, href, acc) => {
    if (seen.has(href)) return; seen.add(href);
    const a = E('a', 'btn' + (acc ? ' acc' : ''), `<i class="${icon}"></i> `); a.append(document.createTextNode(text));
    a.href = href; a.target = '_blank'; a.rel = 'noopener'; f.append(a);
  };
  p.cta.links.forEach((l, i) => add(l[0], l[1], l[2], i === 0));
  SITE.links.filter(l => l[0].includes('discord')).forEach(l => add(l[0], 'Discord', l[1], false));
  const ft = E('div', 'foot', SITE.footer); f.append(ft);
  ui.sbar.replaceChildren(f);
}

/* =====================================================================
   Search (ranking identical to the library: label start > word start > anywhere > section/page > tooltip)
   ===================================================================== */
const KIND_ORDER = null;
function labelScore(l, tok) {
  const pos = l.indexOf(tok);
  if (pos < 0) return null;
  if (pos === 0) return 100;
  if (l.indexOf(' ' + tok) >= 0) return 80;
  return 60;
}
function search(q, limit = 80) {
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean), res = [];
  if (!tokens.length) return { res, tokens };
  state.M.entries.forEach((e, seq) => {
    let score = 0, ok = true, viaTip = false;
    for (const tok of tokens) {
      let s = labelScore(e.l, tok);
      if (s == null) { if (e.k.includes(tok)) s = 25; else if (e.t.includes(tok)) { s = 15; viaTip = true; } }
      if (s == null) { ok = false; break; }
      score += s;
    }
    if (ok) res.push({ e, score, viaTip, seq });
  });
  res.sort((a, b) => b.score - a.score || a.seq - b.seq);
  return { res: res.slice(0, limit), tokens };
}
function hl(text, tokens) {
  const low = text.toLowerCase(), marks = [];
  tokens.forEach(t => { const i = low.indexOf(t); if (i >= 0) marks.push([i, i + t.length]); });
  if (!marks.length) return esc(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = [marks[0]];
  for (let i = 1; i < marks.length; i++) { const l = merged[merged.length - 1]; if (marks[i][0] <= l[1]) l[1] = Math.max(l[1], marks[i][1]); else merged.push(marks[i]); }
  let out = '', pos = 0;
  merged.forEach(m => { out += esc(text.slice(pos, m[0])) + '<mark>' + esc(text.slice(m[0], m[1])) + '</mark>'; pos = m[1]; });
  return out + esc(text.slice(pos));
}
function snippet(text, tokens) {
  const low = text.toLowerCase();
  for (const t of tokens) {
    const s = low.indexOf(t);
    if (s >= 0) { const a = Math.max(0, s - 24); return (a > 0 ? '...' : '') + text.slice(a, a + 80) + (text.length > a + 80 ? '...' : ''); }
  }
  return text.slice(0, 80);
}
function renderResults(res, tokens, q) {
  const r = ui.res; r.replaceChildren();
  const t = E('div', 'rt'); t.innerHTML = res.length ? (res.length === 1 ? '1 result' : res.length + ' results') : 'No settings match &nbsp;<b>' + esc(q) + '</b>';
  r.append(t);
  res.forEach(x => {
    const e = x.e, b = E('button', 'rr');
    const label = e.label || e.page.title, shown = label.length > 90 ? snippet(label, tokens) : label;
    let sub = esc(e.crumb);
    if (x.viaTip && e.tip) sub += ' &nbsp;-&nbsp; ' + hl(snippet(e.tip, tokens), tokens);
    else if (e.kind === 'Page' && e.tip) sub += ' &nbsp;-&nbsp; ' + esc(snippet(e.tip, tokens));
    b.innerHTML = `<span class="k">${esc(e.kind)}</span><span class="l">${hl(shown, tokens)}</span><span class="s">${sub}</span>`;
    b.onclick = () => goTo(e);
    r.append(b);
  });
  r.hidden = false;
}
function onSearch(text) {
  text = text.trim();
  ui.qclr.hidden = !text;
  if (!text) { if (state.query) { state.query = ''; state.hits = null; state.results = null; showCurrent(); renderNav(); } return; }
  state.query = text;
  const { res, tokens } = search(text);
  state.results = res;
  const hits = {}; res.forEach(r => hits[r.e.page.id] = (hits[r.e.page.id] || 0) + 1); state.hits = hits;
  state.M.order.forEach(i => state.M.pages[i].root.hidden = true);
  renderResults(res, tokens, text);
  ui.sc.scrollTop = 0;
  renderNav();
}
let searchGen = 0;
ui.q.addEventListener('input', () => {
  const v = ui.q.value; searchGen++;
  if (!v.trim()) { onSearch(v); return; }
  const g = searchGen;
  setTimeout(() => { if (g === searchGen) onSearch(ui.q.value); }, 100);
});
ui.q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { ui.q.value = ''; onSearch(''); ui.q.blur(); }
  if (e.key === 'Enter') {
    if (state.query !== ui.q.value.trim()) { searchGen++; onSearch(ui.q.value); }
    const r = state.results && state.results[0]; if (r) goTo(r.e);
  }
});
ui.qclr.onclick = () => { ui.q.value = ''; onSearch(''); ui.q.focus(); };

/* =====================================================================
   Navigation: select a page, jump to an element, hash routing
   ===================================================================== */
function showCurrent() {
  const M = state.M;
  M.order.forEach(i => M.pages[i].root.hidden = true);
  ui.res.hidden = true;
  const pg = M.pages[state.current]; if (!pg) return;
  pg.root.hidden = false; ui.sc.scrollTop = 0;
}
function hashFor(key, id, anchor) {
  const h = SITE.products[key].hash, pid = id && id !== 'home' ? id + (anchor ? ':' + anchor : '') : '';
  return h && pid ? h + '/' + pid : (h || pid);
}
function select(id, o = {}) {
  const M = state.M, pg = M.pages[id] || M.pages.home;
  const a = o.anchor && pg.anchors.find(x => x.id === o.anchor);
  ui.q.value = ''; ui.qclr.hidden = true; state.query = ''; state.hits = null; state.results = null;
  const changed = state.current !== pg.id;
  if (pg.anchors.length && (changed || a)) state.collapsed[pg.id] = false;
  state.current = pg.id; state.anchor = a ? a.id : null;
  showCurrent(); renderNav();
  const h = hashFor(state.key, pg.id, state.anchor);
  if (o.push !== false && location.hash.slice(1) !== h) history.pushState(null, '', h ? '#' + h : location.pathname + location.search);
  document.title = (pg.id === 'home' ? '' : pg.title + ' - ') + M.p.title;
  ui.win.classList.remove('nav-open');
  if (a) {
    setOpen(a.el, true);
    const go = () => scrollToEl(pg, a.el);
    setTimeout(() => { go(); flash(a.el); }, 50); setTimeout(go, 220);
  }
}
function reveal(page, el) {
  for (let p = el; p && p !== page.root; p = p.parentElement) if (p.classList.contains('col')) setOpen(p, true);
  const pv = $('.pv.shut', page.root); if (pv && pv.classList.contains('sticky')) pv.classList.remove('shut');
}
function scrollToEl(page, el) {
  const sc = ui.sc, off = 18 + (page.sticky && !page.sticky.classList.contains('shut') && getComputedStyle(page.sticky).position === 'sticky' ? page.sticky.offsetHeight : page.sticky ? 30 : 0);
  sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - off;
}
function flash(el) {
  const f = E('div', 'flash'); el.append(f); setTimeout(() => f.remove(), 1900);
}
function goTo(e) {
  select(e.page.id);
  const el = e.el;
  if (!el || e.kind === 'Page') return;
  reveal(e.page, el);
  setTimeout(() => { scrollToEl(e.page, el); flash(el); }, 50);
  setTimeout(() => scrollToEl(e.page, el), 220);
}
function parseHash() {
  const parts = location.hash.slice(1).split('/');
  const key = keys.find(k => SITE.products[k].hash && SITE.products[k].hash === parts[0]);
  const raw = (key ? parts[1] : parts[0]) || ''; const [pid, anc] = raw.split(':');
  return { key: key || keys[0], page: pid || null, anchor: anc || null };
}
function setProduct(key) {
  state.key = key; state.M = models[key] || (models[key] = buildModel(key));
  const M = state.M;
  ui.pages.replaceChildren(...M.order.map(i => M.pages[i].root));
  state.collapsed = {}; M.order.forEach(i => { if (M.pages[i].anchors.length) state.collapsed[i] = true; });
  state.current = null; state.query = ''; ui.q.value = ''; ui.qclr.hidden = true;
  $$('.ptab').forEach(t => t.classList.toggle('on', t.dataset.k === key));
  renderSideBar();
}
function route() {
  const { key, page, anchor } = parseHash();
  if (key !== state.key) setProduct(key);
  select(page || 'home', { push: false, anchor });
}

/* =====================================================================
   Chrome: title bar, mobile drawer, lightbox, shortcuts
   ===================================================================== */
$('#brand').textContent = SITE.brand;
$('#tabs').innerHTML = keys.map(k => `<button class="ptab" data-k="${k}"><i class="${SITE.products[k].icon}"></i>${SITE.products[k].tab}</button>`).join('');
$('#links').innerHTML = SITE.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener" aria-label="${l[0].split('-').pop()}"><i class="${l[0]}"></i></a>`).join('');
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.ptab'); if (!t) return;
  if (t.dataset.k !== state.key) setProduct(t.dataset.k);
  select('home');
});
$('#themeBtn').onclick = () => { if (menuEl) hideMenu(); else themeMenu(); };
$('#burger').onclick = () => ui.win.classList.toggle('nav-open');
$('#scrim').onclick = () => ui.win.classList.remove('nav-open');
document.addEventListener('click', e => {
  const im = e.target.closest('img[data-lb]');
  if (im) { $('#lb img').src = im.currentSrc || im.src; $('#lb').classList.add('on'); }
  else if (e.target.closest('#lb')) $('#lb').classList.remove('on');
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#lb').classList.remove('on'); hideMenu(); }
  const typing = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''));
  if (!typing && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
    e.preventDefault(); ui.win.classList.add('nav-open'); ui.q.focus(); ui.q.select();
  }
});
addEventListener('popstate', route);

applyTheme(state.theme);
route();
})();
